name: One-time native desktop integration patch

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-desktop-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration fixes
        shell: python
        run: |
          from pathlib import Path

          selection = Path('src/Hello1Drive.Core/Views/MainView.SelectionActions.cs')
          text = selection.read_text(encoding='utf-8')
          old = '''    private void InitializeSelectionActionEnhancements()\n    {\n        if (IsMobilePlatform)\n            EnsureMobileSelectionRenameButton();\n        else\n            EnsureDesktopSelectionContextActions();\n    }'''
          new = '''    private void InitializeSelectionActionEnhancements()\n    {\n        if (IsMobilePlatform)\n        {\n            EnsureMobileSelectionRenameButton();\n        }\n        else\n        {\n            EnsureDesktopSelectionContextActions();\n            InitializeDesktopExperienceEnhancements();\n        }\n    }'''
          if old not in text:
              raise SystemExit('selection initialization block not found')
          text = text.replace(old, new, 1)
          old = '''        _mobileSelectionRenameButton = null;\n\n        if (_desktopDestinationOverlayHooksAttached)'''
          new = '''        _mobileSelectionRenameButton = null;\n\n        if (!IsMobilePlatform)\n            DisposeDesktopExperienceEnhancements();\n\n        if (_desktopDestinationOverlayHooksAttached)'''
          if old not in text:
              raise SystemExit('selection disposal anchor not found')
          text = text.replace(old, new, 1)
          selection.write_text(text, encoding='utf-8', newline='\n')

          native = Path('src/Hello1Drive.Desktop/Services/WindowsNativeDesktopFileListFactory.cs')
          text = native.read_text(encoding='utf-8')
          old = '''    [DllImport("user32.dll")]\n    private static extern nint GetModuleHandleW(string? moduleName);'''
          new = '''    [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]\n    private static extern nint GetModuleHandleW(string? moduleName);'''
          if old not in text:
              raise SystemExit('GetModuleHandle import anchor not found')
          native.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Commit integration fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Hello1Drive.Core/Views/MainView.SelectionActions.cs src/Hello1Drive.Desktop/Services/WindowsNativeDesktopFileListFactory.cs
          git commit -m "[native-desktop-patch] Finalize native desktop integration"
          git push
