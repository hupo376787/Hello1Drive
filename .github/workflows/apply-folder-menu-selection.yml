name: Apply folder menu selection

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/apply_folder_menu_selection.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply source patch
        run: python .github/scripts/apply_folder_menu_selection.py
      - name: Validate source changes
        shell: bash
        run: |
          git diff --check
          grep -q 'IsSystemDefaultSort' src/Hello1Drive.Core/ViewModels/MainViewModel.cs
          grep -q 'IsLargeIconView' src/Hello1Drive.Core/Views/MainView.axaml
          grep -q 'HelloAccentBrush' src/Hello1Drive.Core/Views/MainView.axaml
          grep -q 'FileViewMode.LargeIcons' src/Hello1Drive.Core/Models/AppSettings.cs
      - name: Build Desktop Release
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release
      - name: Commit final source
        shell: bash
        run: |
          rm -f .github/scripts/apply_folder_menu_selection.py
          rm -f .github/workflows/apply-folder-menu-selection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remember folder view and sort selections'
          git push origin HEAD:master
