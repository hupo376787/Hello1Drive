name: Apply iOS FAB and thumbnail prefetch

on:
  push:
    branches:
      - master
    paths:
      - tools/apply_ios_fab_and_thumbnail_prefetch.py
      - .github/workflows/apply-ios-fab-thumbnail-prefetch.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source patch
        run: python3 tools/apply_ios_fab_and_thumbnail_prefetch.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'if (UsesNativeMobileFileList)' src/Hello1Drive.Core/Views/MainView.axaml.cs
          grep -q 'public UIView RootView => _root;' src/Hello1Drive.iOS/Services/IosNativeMobileFileListFactory.cs
          grep -q 'IosNativeFloatingUploadButtonView' src/Hello1Drive.iOS/Services/IosNativeMobileFileListFactory.cs
          grep -q 'PrefetchThumbnailIfNeeded(last + distance)' src/Hello1Drive.Android/Services/AndroidNativeMobileFileListFactory.cs
          grep -q 'PrefetchThumbnailIfNeeded(last + distance)' src/Hello1Drive.iOS/Services/IosNativeMobileFileListFactory.cs

      - name: Remove one-shot helper
        run: |
          rm -f tools/apply_ios_fab_and_thumbnail_prefetch.py
          rm -f .github/workflows/apply-ios-fab-thumbnail-prefetch.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add iOS native FAB and adjacent thumbnail prefetch"
          git push origin HEAD:master
