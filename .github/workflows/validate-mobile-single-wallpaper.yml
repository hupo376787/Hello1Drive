name: Validate mobile single wallpaper safe area

on:
  push:
    branches:
      - fix/mobile-single-wallpaper-safe-area

permissions:
  contents: read

jobs:
  android-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build Core
        run: dotnet build src/Hello1Drive.Core/Hello1Drive.Core.csproj -c Release
      - name: Build Android
        run: dotnet build src/Hello1Drive.Android/Hello1Drive.Android.csproj -c Release -f net10.0-android36.0
