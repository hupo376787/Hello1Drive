name: Apply view menu dot layout

on:
  push:
    paths:
      - 'scripts/move-view-selection-dot.py'
      - '.github/workflows/apply-view-dot-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply source patch
        run: python3 scripts/move-view-selection-dot.py
      - name: Validate source changes
        run: |
          git diff --check
          grep -q 'ColumnDefinitions="8,14"' src/Hello1Drive.Core/Views/MainView.axaml
      - name: Build Desktop Release
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release
      - name: Commit final source
        run: |
          rm -f scripts/move-view-selection-dot.py .github/workflows/apply-view-dot-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move selected view dot before icon'
          git push
