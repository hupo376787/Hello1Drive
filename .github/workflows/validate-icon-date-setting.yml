name: Validate icon date setting

on:
  push:
    branches:
      - feat/show-date-in-icon-view

permissions:
  contents: read

concurrency:
  group: validate-icon-date-setting
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install iOS workload
        run: dotnet workload install ios
      - name: Build iOS without signing
        run: dotnet build src/Hello1Drive.iOS/Hello1Drive.iOS.csproj -c Release -f net10.0-ios26.0 -p:ValidateXcodeVersion=false -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:AppIcon=
