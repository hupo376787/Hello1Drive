name: Apply desktop virtual surface

on:
  push:
    branches:
      - master
    paths:
      - tools/apply_desktop_virtual_surface.py
      - .github/workflows/apply-desktop-virtual-surface.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # This workflow is intentionally one-shot; the final successful commit removes it.
      - name: Apply source patch
        run: python3 tools/apply_desktop_virtual_surface.py

      - name: Validate migration
        run: |
          git diff --check
          grep -q 'class DesktopVirtualFileSurface' src/Hello1Drive.Core/Controls/DesktopVirtualFileSurface.cs
          grep -q 'x:Name="DesktopFileSurface"' src/Hello1Drive.Core/Views/MainView.axaml
          grep -q 'GetVisibleRange' src/Hello1Drive.Core/Views/MainView.axaml.cs
          ! grep -q 'DesktopDetailsRepeater\|DesktopLargeIconRepeater\|DesktopExtraLargeIconRepeater' src/Hello1Drive.Core/Views/MainView.axaml src/Hello1Drive.Core/Views/MainView.axaml.cs
          ! grep -q 'DesktopDetailsScrollViewer\|DesktopLargeIconScrollViewer\|DesktopExtraLargeIconScrollViewer' src/Hello1Drive.Core/Views/MainView.axaml src/Hello1Drive.Core/Views/MainView.axaml.cs

      - name: Build desktop release
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release

      - name: Remove one-shot helper
        run: |
          rm -f tools/apply_desktop_virtual_surface.py
          rm -f .github/workflows/apply-desktop-virtual-surface.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use one virtual desktop file surface"
          git push origin HEAD:master
