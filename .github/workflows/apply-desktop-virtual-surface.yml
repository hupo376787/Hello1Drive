name: Apply desktop virtual surface

on:
  pull_request:
    branches:
      - master
    paths:
      - tools/apply_desktop_virtual_surface.py
      - .github/workflows/apply-desktop-virtual-surface.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # PR validation applies the migration to its own head branch and compiles it before commit.
      - name: Apply source patch
        run: |
          python3 tools/apply_desktop_virtual_surface.py
          python3 - <<'PY'
          from pathlib import Path
          main = Path('src/Hello1Drive.Core/Views/MainView.axaml.cs')
          text = main.read_text(encoding='utf-8')
          stale = '\n;\n\n    private static bool ShouldSuppressMarqueeStart'
          fixed = '\n\n    private static bool ShouldSuppressMarqueeStart'
          if stale not in text:
              raise SystemExit('expected stale expression-bodied semicolon was not found')
          main.write_text(text.replace(stale, fixed, 1), encoding='utf-8')

          surface = Path('src/Hello1Drive.Core/Controls/DesktopVirtualFileSurface.cs')
          text = surface.read_text(encoding='utf-8')
          old = '''            var index = (int)Math.Floor(point.Y / DetailsRowHeight);\n            return index >= 0 && index < vm.VirtualItems.Count ? index : -1;'''
          new = '''            var detailIndex = (int)Math.Floor(point.Y / DetailsRowHeight);\n            return detailIndex >= 0 && detailIndex < vm.VirtualItems.Count ? detailIndex : -1;'''
          if old not in text:
              raise SystemExit('expected detail index block was not found')
          surface.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate migration
        run: |
          git diff --check
          grep -q 'class DesktopVirtualFileSurface' src/Hello1Drive.Core/Controls/DesktopVirtualFileSurface.cs
          grep -q 'x:Name="DesktopFileSurface"' src/Hello1Drive.Core/Views/MainView.axaml
          grep -q 'GetVisibleRange' src/Hello1Drive.Core/Views/MainView.axaml.cs
          ! grep -q 'DesktopDetailsRepeater\|DesktopLargeIconRepeater\|DesktopExtraLargeIconRepeater' src/Hello1Drive.Core/Views/MainView.axaml src/Hello1Drive.Core/Views/MainView.axaml.cs
          ! grep -q 'DesktopDetailsScrollViewer\|DesktopLargeIconScrollViewer\|DesktopExtraLargeIconScrollViewer' src/Hello1Drive.Core/Views/MainView.axaml src/Hello1Drive.Core/Views/MainView.axaml.cs

      - name: Build desktop release
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release

      - name: Remove one-shot helper
        run: |
          rm -f tools/apply_desktop_virtual_surface.py
          rm -f .github/workflows/apply-desktop-virtual-surface.yml

      - name: Commit and push to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use one virtual desktop file surface"
          git push origin HEAD:${{ github.head_ref }}
