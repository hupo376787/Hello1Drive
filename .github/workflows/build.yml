name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish desktop
        shell: bash
        run: |
          dotnet publish src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            -o "publish/desktop/${{ matrix.rid }}" -p:PublishSingleFile=false
      - uses: actions/upload-artifact@v4
        with:
          name: Hello1Drive-Desktop-${{ matrix.rid }}
          path: publish/desktop/${{ matrix.rid }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools
      - run: dotnet publish src/Hello1Drive.Browser/Hello1Drive.Browser.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Hello1Drive-Browser
          path: src/Hello1Drive.Browser/bin/Release/net10.0-browser/publish/wwwroot

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - run: dotnet publish src/Hello1Drive.Android/Hello1Drive.Android.csproj -c Release -f net10.0-android36.0
      - name: Prepare Android packages
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="src/Hello1Drive.Android/bin/Release/net10.0-android36.0/publish"
          TARGET="publish/android"
          mkdir -p "$TARGET"

          APK="$(find "$SOURCE" -maxdepth 1 -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            APK="$(find "$SOURCE" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          fi

          AAB="$(find "$SOURCE" -maxdepth 1 -type f -name '*-Signed.aab' -print -quit)"
          if [[ -z "$AAB" ]]; then
            AAB="$(find "$SOURCE" -maxdepth 1 -type f -name '*.aab' -print -quit)"
          fi

          if [[ -z "$APK" || -z "$AAB" ]]; then
            echo "Android publish output is missing APK or AAB."
            find "$SOURCE" -maxdepth 1 -type f -print
            exit 1
          fi

          cp "$APK" "$TARGET/Hello1Drive-Android.apk"
          cp "$AAB" "$TARGET/Hello1Drive-Android.aab"

      - name: Upload APK directly
        uses: actions/upload-artifact@v7
        with:
          path: publish/android/Hello1Drive-Android.apk
          archive: false

      - name: Upload AAB directly
        uses: actions/upload-artifact@v7
        with:
          path: publish/android/Hello1Drive-Android.aab
          archive: false
