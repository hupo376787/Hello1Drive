name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish desktop
        shell: bash
        run: |
          dotnet publish src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            -o "publish/desktop/${{ matrix.rid }}" /p:PublishSingleFile=false
      - uses: actions/upload-artifact@v4
        with:
          name: Hello1Drive-Desktop-${{ matrix.rid }}
          path: publish/desktop/${{ matrix.rid }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools
      - run: dotnet publish src/Hello1Drive.Browser/Hello1Drive.Browser.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: Hello1Drive-Browser
          path: src/Hello1Drive.Browser/bin/Release/net10.0-browser/publish/wwwroot

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - run: dotnet publish src/Hello1Drive.Android/Hello1Drive.Android.csproj -c Release -f net10.0-android36.0
      - uses: actions/upload-artifact@v4
        with:
          name: Hello1Drive-Android
          path: |
            src/Hello1Drive.Android/bin/Release/net10.0-android36.0/publish/*.apk
            src/Hello1Drive.Android/bin/Release/net10.0-android36.0/publish/*.aab

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install ios
      - name: Build iOS simulator
        run: >-
          dotnet publish src/Hello1Drive.iOS/Hello1Drive.iOS.csproj
          -c Release -f net10.0-ios26.0 -r iossimulator-arm64
          /p:CodesignKey= /p:CodesignProvision=
      - uses: actions/upload-artifact@v4
        with:
          name: Hello1Drive-iOS-Simulator-arm64
          path: src/Hello1Drive.iOS/bin/Release/net10.0-ios26.0/iossimulator-arm64/publish
