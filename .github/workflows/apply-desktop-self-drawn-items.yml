name: Apply desktop self-drawn items

on:
  push:
    branches:
      - master
    paths:
      - tools/apply_desktop_self_drawn_items.py
      - .github/workflows/apply-desktop-self-drawn-items.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply source patch
        run: python3 tools/apply_desktop_self_drawn_items.py

      - name: Validate source patch
        run: |
          git diff --check
          grep -q 'class DesktopFileItemControl' src/Hello1Drive.Core/Controls/DesktopFileItemControl.cs
          grep -q 'Mode="Details"' src/Hello1Drive.Core/Views/MainView.axaml
          grep -q 'Do no thumbnail traversal' src/Hello1Drive.Core/Views/MainView.axaml.cs
          grep -q 'CancelThumbnailLoading(deferCallbacks: true)' src/Hello1Drive.Core/ViewModels/MainViewModel.cs

      - name: Build desktop
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release

      - name: Remove one-shot helper
        run: |
          rm -f tools/apply_desktop_self_drawn_items.py
          rm -f .github/workflows/apply-desktop-self-drawn-items.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use self-drawn desktop file items"
          git push origin HEAD:master
