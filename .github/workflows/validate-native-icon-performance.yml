name: Validate native icon paint performance

on:
  push:
    branches:
      - fix/native-icon-paint-performance

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core
        shell: pwsh
        run: dotnet build src/Hello1Drive.Core/Hello1Drive.Core.csproj -c Release
      - name: Build Desktop
        shell: pwsh
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release
