name: Apply transfer path and file artwork fix

on:
  push:
    branches:
      - master
    paths:
      - tools/apply_transfer_path_and_file_art_fix.py
      - .github/workflows/apply-transfer-path-and-file-art-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden one-shot patch helper
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/apply_transfer_path_and_file_art_fix.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)")
          text = text.replace(
              "new UIBezierPath(new CGRect(rect.Left, stripRect.Top, rect.Width, (nfloat)(radius * 0.65))).Fill();",
              "using (var stripTopFill = UIBezierPath.FromRect(new CGRect(rect.Left, stripRect.Top, rect.Width, (nfloat)(radius * 0.65))))\n        {\n            stripTopFill.Fill();\n        }")
          path.write_text(text, encoding="utf-8")

      - name: Apply source patch
        run: python3 tools/apply_transfer_path_and_file_art_fix.py

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'FileName = GetTransferDisplayName(fileName)' src/Hello1Drive.Core/ViewModels/MainViewModel.cs
          grep -F 'DrawImagePlaceholder(canvas, rect)' src/Hello1Drive.Android/Services/AndroidNativeMobileFileListFactory.cs
          grep -F 'DrawImagePlaceholder(rect)' src/Hello1Drive.iOS/Services/IosNativeMobileFileListFactory.cs

      - name: Commit and push source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve transfer paths and restore file type artwork"
          git push origin HEAD:master
