name: Apply combined view mode UI

on:
  push:
    branches:
      - master
    paths:
      - tools/apply_combined_view_mode_ui.py
      - .github/workflows/apply-combined-view-mode-ui.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source patch
        run: python3 tools/apply_combined_view_mode_ui.py

      - name: Validate patch
        run: |
          git diff --check
          grep -F 'ToolTip.Tip="查看方式"' src/Hello1Drive.Core/Views/MainView.axaml
          grep -F 'x:Name="MobileViewModeActionsOverlay"' src/Hello1Drive.Core/Views/MainView.axaml
          grep -F 'MobileViewModeButton_Click' src/Hello1Drive.Core/Views/MainView.axaml.cs
          grep -F 'MobileViewModeActionsOverlay.IsVisible ||' src/Hello1Drive.Core/Views/MainView.axaml.cs
          test "$(grep -c 'ToolTip.Tip="详细信息" Tag="Details" Click="ViewModeButton_Click"' src/Hello1Drive.Core/Views/MainView.axaml || true)" -eq 0
          test "$(grep -c 'ToolTip.Tip="大图标" Tag="LargeIcons" Click="ViewModeButton_Click"' src/Hello1Drive.Core/Views/MainView.axaml || true)" -eq 0
          test "$(grep -c 'ToolTip.Tip="超大图标" Tag="ExtraLargeIcons" Click="ViewModeButton_Click"' src/Hello1Drive.Core/Views/MainView.axaml || true)" -eq 0

      - name: Remove one-shot helper
        run: |
          rm -f tools/apply_combined_view_mode_ui.py
          rm -f .github/workflows/apply-combined-view-mode-ui.yml

      - name: Commit and push source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Combine view mode controls into one menu"
          git push origin HEAD:master
