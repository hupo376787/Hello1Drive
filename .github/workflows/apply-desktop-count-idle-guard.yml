name: Apply desktop count idle guard

on:
  pull_request:
    branches:
      - master
    paths:
      - tools/apply_desktop_count_idle_guard.py
      - .github/workflows/apply-desktop-count-idle-guard.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply count idle guard
        run: python3 tools/apply_desktop_count_idle_guard.py

      - name: Validate
        run: |
          git diff --check
          grep -q 'ApplyFolderTotalCountWhenIdleAsync' src/Hello1Drive.Core/ViewModels/MainViewModel.cs
          grep -q 'while (!IsMobilePlatform && _desktopListScrolling)' src/Hello1Drive.Core/ViewModels/MainViewModel.cs
          grep -q 'DispatcherPriority.Background' src/Hello1Drive.Core/ViewModels/MainViewModel.cs

      - name: Build desktop release
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release

      - name: Remove one-shot helper
        run: |
          rm -f tools/apply_desktop_count_idle_guard.py
          rm -f .github/workflows/apply-desktop-count-idle-guard.yml

      - name: Commit and push to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep folder count growth out of desktop scrolling"
          git push origin HEAD:${{ github.head_ref }}
