name: One-time native desktop build

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj
      - run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Debug --no-restore
