name: Validate native hover thumbnail scroll v3
# final branch validation

on:
  push:
    branches:
      - fix/native-hover-thumbnail-scroll-v3

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop
        shell: pwsh
        run: dotnet build src/Hello1Drive.Desktop/Hello1Drive.Desktop.csproj -c Release
