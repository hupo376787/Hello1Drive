name: Validate Android system bar background

on:
  push:
    branches:
      - fix/android-system-bar-background

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core
        shell: pwsh
        run: dotnet build src/Hello1Drive.Core/Hello1Drive.Core.csproj -c Release
