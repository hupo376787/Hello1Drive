name: One-time native desktop compile fix

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-desktop-compile-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path
          p = Path('src/Hello1Drive.Desktop/Services/WindowsNativeDesktopFileListFactory.cs')
          text = p.read_text(encoding='utf-8')
          old = '    private const uint WM_SETREDRAW = 0x000B;'
          new = '    private const int WM_SETREDRAW = 0x000B;'
          if old not in text:
              raise SystemExit('WM_SETREDRAW declaration not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Hello1Drive.Desktop/Services/WindowsNativeDesktopFileListFactory.cs
          git commit -m "[native-desktop-compile-fix] Fix Win32 message parameter type"
          git push
