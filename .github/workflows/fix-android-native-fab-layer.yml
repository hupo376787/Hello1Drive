name: Apply Android native FAB layer fix

on:
  push:
    branches:
      - master
    paths:
      - tools/fix_android_native_fab_layer.py
      - .github/workflows/fix-android-native-fab-layer.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source patch
        run: python3 tools/fix_android_native_fab_layer.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'FloatingActionCanvas.IsVisible = false' src/Hello1Drive.Core/Views/MainView.axaml.cs
          grep -q 'public View RootView => _root;' src/Hello1Drive.Android/Services/AndroidNativeMobileFileListFactory.cs
          grep -q 'NativeFloatingUploadButtonView' src/Hello1Drive.Android/Services/AndroidNativeMobileFileListFactory.cs

      - name: Remove one-shot helper
        run: |
          rm -f tools/fix_android_native_fab_layer.py
          rm -f .github/workflows/fix-android-native-fab-layer.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Android upload FAB above native file items"
          git push origin HEAD:master
