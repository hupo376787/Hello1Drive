name: Fix view mode overlay pointer routing

on:
  push:
    branches:
      - master
    paths:
      - tools/fix_view_mode_overlay_pointer.py
      - .github/workflows/fix-view-mode-overlay-pointer.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix
        run: python3 tools/fix_view_mode_overlay_pointer.py

      - name: Validate
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/Hello1Drive.Core/Views/MainView.axaml').read_text(encoding='utf-8')
          start = text.index('    <!-- Mobile view-mode action panel.')
          end = text.index('    <!-- Mobile sort action panel.', start)
          block = text[start:end]
          assert 'PointerPressed="OverlayContent_PointerPressed"' in block
          PY

      - name: Remove one-shot helper
        run: |
          rm -f tools/fix_view_mode_overlay_pointer.py
          rm -f .github/workflows/fix-view-mode-overlay-pointer.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix view mode overlay pointer routing"
          git push origin HEAD:master
